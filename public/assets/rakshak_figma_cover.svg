<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1A1333" />
      <stop offset="50%" stop-color="#0B0E18" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>
    
    <!-- Solana Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B2E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F1322" stop-opacity="0.9" />
    </linearGradient>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Atmospheric Glow Orbs -->
  <circle cx="280" cy="240" r="320" fill="#9945FF" opacity="0.18" filter="url(#purpleGlow)" />
  <circle cx="1640" cy="820" r="380" fill="#14F195" opacity="0.15" filter="url(#purpleGlow)" />

  <!-- Header Badges -->
  <g transform="translate(140, 110)">
    <rect width="360" height="42" rx="21" fill="#1B2236" stroke="#9945FF" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="24" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#D8B4FE" letter-spacing="1">⚡ SUPERTEAM INDIA OPEN BOUNTY</text>

    <rect x="380" width="310" height="42" rx="21" fill="#132624" stroke="#14F195" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="404" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#14F195" letter-spacing="1">FIGMA CONFIG BENGALURU 2026</text>
  </g>

  <!-- Hero Typography -->
  <text x="140" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Rakshak: UPI-Simple Solana</text>
  
  <text x="140" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="600" fill="url(#solanaGrad)">Redesigning Solana's 3 Most Stressful Wallet Moments</text>

  <text x="140" y="350" font-family="Inter, sans-serif" font-size="18" fill="#94A3B8" max-width="800">
    Built for 400M+ Indians who trust UPI daily. Featuring Rakshak Mode (Hindi/Hinglish + Voice) &amp; 10s Pre-Broadcast Undo Window.
  </text>

  <!-- Author & Metadata Card -->
  <g transform="translate(140, 410)">
    <rect width="720" height="110" rx="16" fill="url(#glassCard)" stroke="#232C48" stroke-width="1.5" />
    <text x="32" y="44" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1">DESIGNER &amp; CONTENDER</text>
    <text x="32" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Rudra (@rudhu29)</text>
    <text x="250" y="78" font-family="Inter, sans-serif" font-size="14" fill="#14F195">Solana Ecosystem Designer</text>

    <text x="460" y="44" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1">PROTOTYPE LIVE</text>
    <text x="460" y="78" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#00C2FF">solana-upi-redesign.vercel.app</text>
  </g>

  <!-- 3 Pillars Cards Row -->
  <g transform="translate(140, 560)">
    <!-- Pillar 1 -->
    <rect width="470" height="230" rx="16" fill="url(#glassCard)" stroke="#232C48" stroke-width="1.5" />
    <circle cx="48" cy="48" r="20" fill="#9945FF" fill-opacity="0.2" />
    <text x="43" y="54" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#D8B4FE">1</text>
    <text x="82" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Send + 10s Undo Window</text>
    <text x="36" y="98" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8" line-height="20">
      • Verified .sol handles &amp; avatar badges
    </text>
    <text x="36" y="128" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
      • ₹10 micro-transfer test option
    </text>
    <text x="36" y="158" font-family="Inter, sans-serif" font-size="13" fill="#14F195" font-weight="600">
      • Client-side 10s pre-broadcast buffer with Cancel
    </text>

    <!-- Pillar 2 -->
    <g transform="translate(500, 0)">
      <rect width="470" height="230" rx="16" fill="url(#glassCard)" stroke="#232C48" stroke-width="1.5" />
      <circle cx="48" cy="48" r="20" fill="#00C2FF" fill-opacity="0.2" />
      <text x="43" y="54" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#00C2FF">2</text>
      <text x="82" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Plain Signing + Rakshak Mode</text>
      <text x="36" y="98" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
        • Simulated INR delta: 1.5 SOL = 296.85 USDC (₹24,639)
      </text>
      <text x="36" y="128" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
        • 4 explicit safety checks passed (zero bytecode dumps)
      </text>
      <text x="36" y="158" font-family="Inter, sans-serif" font-size="13" fill="#14F195" font-weight="600">
        • Opt-in voice readout (Hindi / Hinglish / English)
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(1000, 0)">
      <rect width="470" height="230" rx="16" fill="url(#glassCard)" stroke="#232C48" stroke-width="1.5" />
      <circle cx="48" cy="48" r="20" fill="#14F195" fill-opacity="0.2" />
      <text x="43" y="54" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#14F195">3</text>
      <text x="82" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Recovery &amp; Honest Fees</text>
      <text x="36" y="98" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
        • 4-step validator pipeline: Confirmed (~400ms)
      </text>
      <text x="36" y="128" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
        • Honest fee: "No funds moved. A small fee (₹0.08) may apply"
      </text>
      <text x="36" y="158" font-family="Inter, sans-serif" font-size="13" fill="#14F195" font-weight="600">
        • 1-tap auto-slippage retry + WhatsApp receipt
      </text>
    </g>
  </g>

  <!-- Bottom Mini Design Tokens Strip -->
  <g transform="translate(140, 830)">
    <rect width="1470" height="90" rx="14" fill="#0C101D" stroke="#1D243B" stroke-width="1" />
    <text x="30" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">UNIFIED DESIGN SYSTEM:</text>
    
    <!-- Safe Swatch -->
    <rect x="230" y="32" width="24" height="24" rx="6" fill="#00F08B" />
    <text x="264" y="49" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#FFFFFF">#00F08B Safe</text>

    <!-- Warning Swatch -->
    <rect x="420" y="32" width="24" height="24" rx="6" fill="#FFB800" />
    <text x="454" y="49" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#FFFFFF">#FFB800 Warning</text>

    <!-- Danger Swatch -->
    <rect x="630" y="32" width="24" height="24" rx="6" fill="#FF3B69" />
    <text x="664" y="49" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#FFFFFF">#FF3B69 Danger</text>

    <!-- Type Scale -->
    <text x="860" y="50" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Type: Plus Jakarta Sans / Inter / JetBrains Mono</text>
    <text x="1240" y="50" font-family="Inter, sans-serif" font-size="12" fill="#14F195">Icon Style: Phosphor 20px Stroke</text>
  </g>

  <!-- Footer Watermark -->
  <text x="140" y="980" font-family="Inter, sans-serif" font-size="13" fill="#64748B">
    Official Superteam India Open Design Bounty Deliverable • Designed for Figma Config Bengaluru 2026 • Ready for Canvas Import
  </text>
</svg>
